<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --p:#D2263D; --p2:#AE1C31; --t:#12877A; --ink:#14161A; --mut:#6B7178; --bd:#E4E8EB; --bg:#F6F7F9; }
  * { box-sizing:border-box; }
  body { width:320px; margin:0; font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif; color:var(--ink); background:var(--bg); }
  .hd { display:flex; align-items:center; gap:9px; padding:14px 16px; background:#131A2A; color:#fff; }
  .hd b { font-size:14px; } .hd small { color:#AEB6C9; font-size:11px; display:block; }
  .mark { color:var(--p); }
  .body { padding:16px; }
  h1 { font-size:14px; margin:0 0 4px; }
  p { font-size:12.5px; color:var(--mut); margin:0 0 12px; line-height:1.5; }
  textarea, input { width:100%; font:inherit; font-size:12px; padding:9px 10px; border:1px solid var(--bd); border-radius:8px; resize:vertical; }
  button { width:100%; border:none; border-radius:9px; padding:11px; font:inherit; font-size:13.5px; font-weight:700; color:#fff; background:var(--p); cursor:pointer; margin-top:10px; }
  button:hover { background:var(--p2); } button:disabled { opacity:.55; cursor:default; }
  button.sec { background:transparent; color:var(--mut); border:1px solid var(--bd); }
  .msg { font-size:12.5px; padding:10px 12px; border-radius:8px; margin-top:12px; display:none; }
  .msg.ok { background:#e3f5f2; color:var(--t); display:block; }
  .msg.bad { background:#fdeae6; color:var(--p2); display:block; }
  .msg.info { background:#e2f2fc; color:#0b7ec2; display:block; }
  .paired { font-size:11.5px; color:var(--mut); margin-top:12px; display:flex; justify-content:space-between; align-items:center; }
  a.link { color:var(--p); cursor:pointer; text-decoration:none; font-weight:600; }
  .foot { font-size:11px; color:var(--mut); margin-top:12px; }
</style>
</head>
<body>
  <div class="hd">
    <span class="mark">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 2 2 7l10 5 10-5-10-5Zm0 7.2L4.9 6 12 4.3 19.1 6 12 9.2ZM4 10.5v4.2c0 1.9 3.6 3.8 8 3.8s8-1.9 8-3.8v-4.2l-8 4-8-4Z"/></svg>
    </span>
    <span><b>Udemy Enroller</b><small>One-click account connect</small></span>
  </div>
  <div class="body">
    <!-- Pairing view -->
    <div id="pair-view" style="display:none">
      <h1>Pair with your site</h1>
      <p>Open your Enroller site &rarr; <b>Connect</b> page, copy the pairing code shown there, and paste it here once.</p>
      <textarea id="pair-input" rows="3" placeholder="Paste pairing code..."></textarea>
      <button id="pair-btn">Pair</button>
    </div>

    <!-- Connect view -->
    <div id="connect-view" style="display:none">
      <h1>Connect this Udemy account</h1>
      <p>Make sure you're logged in to <b>udemy.com</b> in this browser, then click below.</p>
      <button id="connect-btn">Connect my Udemy account</button>
      <div class="paired">
        <span id="paired-to"></span>
        <a class="link" id="unpair">Change site</a>
      </div>
    </div>

    <div class="msg" id="msg"></div>
    <div class="foot" id="foot"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
